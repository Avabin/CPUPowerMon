<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the fixed service name. -->
  <policy user="root">
    <allow own="org.cpupowermon.CpuMon"/>
    <allow send_destination="org.cpupowermon.CpuMon"/>
    <allow receive_sender="org.cpupowermon.CpuMon"/>
  </policy>

  <!-- Unprivileged clients get read/call access only, never name ownership. -->
  <policy context="default">
    <deny own="org.cpupowermon.CpuMon"/>

    <allow send_destination="org.cpupowermon.CpuMon"
           send_interface="org.cpupowermon.CpuMon1"/>
    <allow send_destination="org.cpupowermon.CpuMon"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.cpupowermon.CpuMon"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.cpupowermon.CpuMon"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow receive_sender="org.cpupowermon.CpuMon"
           receive_interface="org.cpupowermon.CpuMon1"
           receive_type="signal"/>
  </policy>
</busconfig>
